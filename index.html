<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>página de login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!--início da página de login-->
<div class="tela-principal"> 
     
    <div class="imagem-esquerda">
      <img src="Professional parking facility background.png" alt="Imagem de login">
    </div>

     <div class="pagina-de-dados">  <!--Aqui é a div só de entradas-->

       <div class="box-login">
          <img src="logo-senac.png" alt="Logo do Senac"> <!--imagem do senac-->
          <h1>Senac CEP Papaléo</h1>
          <h2 class="media">Gestão de Estacionamento</h2><br>
       </div>
   
       <!--formulário de login-->
   <div class="formulario">
     <form action="form" method="post">
      <div class="caixa-form">
        <label for="user">CPF ou CNH</label>
        <input type="text" id="text" placeholder="000.000.000.00">

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder ="••••••">
       </div>

     <div class="caixa-pequena" >
        <input type="checkbox" id="lembrar">
        <label for="lembrar">Lembrar neste dispositivo</label>
     </div>

     <div class="caixa-form">
        <button>Entrar</button>
     </div>

     <p>Todos os direitos reservados</p>
      </form>
    </div>
</div> <!--fechamento da principal-->
</div> <!--fechamento da tela principal-->




</body>
</html>
